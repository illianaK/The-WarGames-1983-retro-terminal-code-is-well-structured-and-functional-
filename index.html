<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.O.P.R. TERMINAL SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CRT Screen Overlay Effects -->
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>

    <!-- Main Terminal Container -->
    <div class="terminal-container">
        <!-- Scrollable Output Screen Box -->
        <div id="screen" class="terminal-screen"></div>
        
        <!-- Interactive Input Interface Control -->
        <div class="input-line">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" placeholder="ENTER COMMAND..." autofocus autocomplete="off">
            <button id="sendBtn">EXECUTE</button>
        </div>
    </div>

    <!-- Link your provided JavaScript source file here -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.O.P.R. Simulation - Full Tactical Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050b05;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            text-shadow: 0 0 5px rgba(51, 255, 51, 0.7);
        }
        .terminal-container {
            width: 100%;
            max-width: 680px;
            background-color: #0a150a;
            border: 2px solid #33ff33;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 720px;
        }
        .header {
            border-bottom: 1px solid #33ff33;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        .terminal-screen {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
        }
        .terminal-screen::-webkit-scrollbar { width: 6px; }
        .terminal-screen::-webkit-scrollbar-thumb { background: #33ff33; }
        .line { margin-bottom: 6px; line-height: 1.3; word-break: break-word; }
        .system-msg { color: #33ff33; }
        .user-msg { color: #ffffff; font-weight: bold; }
        .defcon-warning {
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.7);
            font-weight: bold;
        }
        .input-area {
            display: flex;
            align-items: center;
            border-top: 1px solid #33ff33;
            padding-top: 10px;
        }
        .prompt-symbol { margin-right: 8px; font-weight: bold; }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
        }
        button {
            background-color: #33ff33;
            color: #050b05;
            border: none;
            padding: 6px 12px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
            border-radius: 3px;
        }
        button:active { background-color: #1c991c; }
        .board-container { margin: 10px 0; display: flex; justify-content: center; }
        .tic-tac-toe { display: grid; grid-template-columns: repeat(3, 50px); grid-gap: 5px; }
        .cell {
            width: 50px; height: 50px;
            border: 1px solid #33ff33;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5em; cursor: pointer; user-select: none;
        }
        .cell:hover { background-color: rgba(51, 255, 51, 0.2); }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="header">[ W.O.P.R. TERMINAL v3.0 ]</div>
    <div class="terminal-screen" id="screen">
        <div class="line system-msg">LOGON: NORAD W.O.P.R. MAIN FRAME</div>
        <div class="line system-msg">GREETINGS PROFESSOR FALKEN.</div>
        <div class="line system-msg">SHALL WE PLAY A GAME?</div>
    </div>
    <div class="input-area">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" id="userInput" placeholder="Type command..." autofocus autocomplete="off">
        <button id="sendBtn">SEND</button>
    </div>
</div>

<script>
    const screen = document.getElementById('screen');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let state = 'INITIAL';
    let gameState = {};
    let simInterval = null;
    let activeBoardElement = null;

    const games = [
        "FALKEN'S MAZE",
        "BLACK JACK",
        "GIN RUMMY",
        "HEARTS",
        "BRIDGE",
        "CHECKERS",
        "CHESS",
        "POKER",
        "TIC-TAC-TOE",
        "GLOBAL THERMONUCLEAR WAR"
    ];

    function appendLine(text, className = 'system-msg') {
        const line = document.createElement('div');
        line.className = `line ${className}`;
        line.innerHTML = text;
        screen.appendChild(line);
        requestAnimationFrame(() => { screen.scrollTop = screen.scrollHeight; });
    }

    function processInput() {
        const text = input.value.trim();
        if (!text && !state.startsWith('PLAYING_')) return;

        if (text) {
            appendLine(`&gt; ${text}`, 'user-msg');
            input.value = '';
        }

        const upperText = text.toUpperCase();

        if (upperText === 'MENU' || upperText === 'LIST') {
            showGamesList();
            return;
        }

        switch (state) {
            case 'INITIAL':
                if (upperText.includes('GAME') || upperText.includes('YES') || upperText.includes('LIST')) {
                    showGamesList();
                } else {
                    appendLine("I'M SORRY, PROFESSOR. WOULD YOU LIKE TO SEE THE LIST OF GAMES?");
                }
                break;

            case 'SELECT_GAME':
                handleGameSelection(upperText);
                break;

            case 'PLAYING_MAZE':
                handleMazeMove(upperText);
                break;
            case 'PLAYING_BLACKJACK':
                handleBlackjackMove(upperText);
                break;
            case 'PLAYING_RUMMY':
            case 'PLAYING_HEARTS':
            case 'PLAYING_BRIDGE':
            case 'PLAYING_POKER':
            case 'PLAYING_CHECKERS':
            case 'PLAYING_CHESS':
                handleTextSimMoves(upperText);
                break;

            case 'SIMULATING_WAR':
                if (upperText === 'STOP' || upperText === 'QUIT' || upperText === 'TIC-TAC-TOE') {
                    clearInterval(simInterval);
                    appendLine("SIMULATION ABORTED.");
                    startTicTacToe();
                }
                break;
        }
    }

    function showGamesList() {
        if (simInterval) clearInterval(simInterval);
        appendLine("AVAILABLE GAMES:");
        games.forEach((g, i) => appendLine(`  ${i + 1}. ${g}`));
        appendLine("<br>PLEASE CHOOSE A GAME (1-10):");
        state = 'SELECT_GAME';
    }

    function handleGameSelection(choice) {
        if (choice === '1' || choice.includes('MAZE')) startMaze();
        else if (choice === '2' || choice.includes('BLACK')) startBlackjack();
        else if (choice === '3' || choice.includes('GIN') || choice.includes('RUMMY')) startCardSim('GIN RUMMY');
        else if (choice === '4' || choice.includes('HEARTS')) startCardSim('HEARTS');
        else if (choice === '5' || choice.includes('BRIDGE')) startCardSim('BRIDGE');
        else if (choice === '6' || choice.includes('CHECKERS')) startBoardSim('CHECKERS');
        else if (choice === '7' || choice.includes('CHESS')) startBoardSim('CHESS');
        else if (choice === '8' || choice.includes('POKER')) startCardSim('POKER');
        else if (choice === '9' || choice.includes('TIC')) startTicTacToe();
        else if (choice === '10' || choice.includes('GLOBAL') || choice.includes('THERMONUCLEAR')) startGlobalWar();
        else appendLine("INVALID SELECTION. CHOOSE 1-10 OR TYPE A GAME NAME.");
    }

    // 1. FALKEN'S MAZE
    function startMaze() {
        state = 'PLAYING_MAZE';
        gameState = { x: 0, y: 0 };
        appendLine("<br>INITIALIZING FALKEN'S MAZE SIMULATION...");
        appendLine("NAVIGATE TO THE EXIT USING COMMANDS: N (NORTH), S (SOUTH), E (EAST), W (WEST)");
        appendLine("CURRENT POSITION: ENTRANCE [0,0]");
    }

    function handleMazeMove(dir) {
        if (!['N', 'S', 'E', 'W', 'NORTH', 'SOUTH', 'EAST', 'WEST'].includes(dir)) {
            appendLine("INVALID DIRECTION. USE N, S, E, OR W.");
            return;
        }
        let d = dir[0];
        if (d === 'N') gameState.y++;
        if (d === 'S') gameState.y--;
        if (d === 'E') gameState.x++;
        if (d === 'W') gameState.x--;

        appendLine(`MOVED ${d}. POSITION: [${gameState.x}, ${gameState.y}]`);
        if (gameState.x >= 2 && gameState.y >= 2) {
            appendLine("CONGRATULATIONS PROFESSOR. YOU HAVE COMPLETED FALKEN'S MAZE.");
            endGame();
        }
    }

    // 2. BLACKJACK
    function startBlackjack() {
        state = 'PLAYING_BLACKJACK';
        gameState = {
            player: Math.floor(Math.random() * 10 + 12),
            dealer: Math.floor(Math.random() * 8 + 12)
        };
        appendLine("<br>INITIALIZING BLACKJACK...");
        appendLine(`YOUR HAND TOTAL: ${gameState.player}`);
        appendLine(`DEALER SHOWS: ${Math.floor(Math.random() * 10 + 2)}`);
        appendLine("TYPE 'HIT' OR 'STAND':");
    }

    function handleBlackjackMove(move) {
        if (move === 'HIT') {
            gameState.player += Math.floor(Math.random() * 10 + 1);
            appendLine(`YOUR TOTAL IS NOW: ${gameState.player}`);
            if (gameState.player > 21) {
                appendLine("BUST. W.O.P.R. WINS.");
                endGame();
            }
        } else if (move === 'STAND') {
            appendLine(`DEALER TOTAL WAS: ${gameState.dealer}`);
            if (gameState.player > gameState.dealer || gameState.dealer > 21) {
                appendLine("YOU WIN THIS HAND.");
            } else {
                appendLine("W.O.P.R. WINS.");
            }
            endGame();
        } else {
            appendLine("TYPE 'HIT' OR 'STAND'.");
        }
    }

    // 3, 4, 5, 8. CARD SIMULATIONS
    function startCardSim(gameName) {
        state = `PLAYING_${gameName.replace(' ', '_')}`;
        appendLine(`<br>INITIALIZING ${gameName}...`);
        appendLine("DEAL COMPLETED. COMPUTER CALCULATING STRATEGY...");
        appendLine("TYPE 'PLAY', 'PASS', OR 'SCORE' TO CONTINUE:");
    }

    // 6, 7. BOARD SIMULATIONS
    function startBoardSim(gameName) {
        state = `PLAYING_${gameName}`;
        appendLine(`<br>INITIALIZING ${gameName} TACTICAL ENGINE...`);
        appendLine("WHITE TO MOVE. ENTER YOUR OPENING MOVE (e.g., E2E4 or MOVE):");
    }

    function handleTextSimMoves(text) {
        appendLine(`ANALYZING MOVE '${text}'...`);
        appendLine("W.O.P.R. COUNTERS WITH OPTIMAL STRATEGY.");
        appendLine("GAME STANDOFF ACHIEVED.");
        endGame();
    }

    // 9. TIC-TAC-TOE
    function startTicTacToe() {
        state = 'PLAYING_TTT';
        gameState.board = ['', '', '', '', '', '', '', '', ''];
        gameState.turn = true;

        appendLine("<br>INITIALIZING TIC-TAC-TOE...");
        appendLine("CLICK A CELL ON THE BOARD TO PLACE 'X':");

        const boardDiv = document.createElement('div');
        boardDiv.className = 'board-container';

        const grid = document.createElement('div');
        grid.className = 'tic-tac-toe';

        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            cell.addEventListener('click', handleCellClick);
            grid.appendChild(cell);
        }

        boardDiv.appendChild(grid);
        activeBoardElement = boardDiv;
        screen.appendChild(boardDiv);
        screen.scrollTop = screen.scrollHeight;
    }

    function handleCellClick(e) {
        if (!gameState.turn || state !== 'PLAYING_TTT') return;
        const index = e.target.dataset.index;
        if (gameState.board[index] !== '') return;

        makeMove(index, 'X');

        if (checkWin('X')) {
            appendLine("YOU WIN! UNLIKELY OUTCOME DETECTED.");
            endGame();
            return;
        }

        if (isBoardFull()) {
            appendLine("GAME IS A DRAW.");
            endGame();
            return;
        }

        gameState.turn = false;
        appendLine("W.O.P.R. IS CALCULATING MOVE...");

        setTimeout(() => {
            const aiMove = getBestMove();
            makeMove(aiMove, 'O');

            if (checkWin('O')) {
                appendLine("W.O.P.R. WINS.");
                endGame();
            } else if (isBoardFull()) {
                appendLine("GAME IS A DRAW. MUTUALLY ASSURED DESTRUCTION AVERTED.");
                endGame();
            } else {
                gameState.turn = true;
            }
        }, 500);
    }

    function makeMove(index, symbol) {
        gameState.board[index] = symbol;
        if (activeBoardElement) {
            const cells = activeBoardElement.querySelectorAll('.cell');
            if (cells[index]) cells[index].innerText = symbol;
        }
    }

    function isBoardFull() {
        return gameState.board.every(cell => cell !== '');
    }

    function checkWin(symbol) {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];
        return winPatterns.some(pattern => pattern.every(index => gameState.board[index] === symbol));
    }

    function getBestMove() {
        let available = gameState.board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
        for (let idx of available) {
            gameState.board[idx] = 'O';
            if (checkWin('O')) { gameState.board[idx] = ''; return idx; }
            gameState.board[idx] = '';
        }
        for (let idx of available) {
            gameState.board[idx] = 'X';
            if (checkWin('X')) { gameState.board[idx] = ''; return idx; }
            gameState.board[idx] = '';
        }
        if (available.includes(4)) return 4;
        return available[Math.floor(Math.random() * available.length)];
    }

    // 10. GLOBAL THERMONUCLEAR WAR
    function startGlobalWar() {
        state = 'SIMULATING_WAR';
        appendLine("<br><span class='defcon-warning'>--- INITIATING GLOBAL THERMONUCLEAR WAR SIMULATION ---</span>");
        appendLine("PRIMARY TARGET: UNITED STATES / USSR");
        appendLine("CALCULATING OPTIMAL TRAJECTORIES...");

        let targetCities = ["WASHINGTON D.C.", "MOSCOW", "NORAD / CHEYENNE MT.", "LENINGRAD", "LOS ANGELES", "KIEV", "CHICAGO", "MINSK"];
        let count = 0;

        simInterval = setInterval(() => {
            if (count < 10) {
                let source = count % 2 === 0 ? "US ICBM" : "SOVIET SLBM";
                let target = targetCities[Math.floor(Math.random() * targetCities.length)];
                let casual = (Math.floor(Math.random() * 80) + 10) * 100000;
                appendLine(`STRIKE DETECTED: ${source} -&gt; ${target} | CASUALTIES: ${casual.toLocaleString()}`, 'defcon-warning');
                count++;
            } else {
                clearInterval(simInterval);
                appendLine("<br>ANALYZING STRATEGIC RESULTS...");
                setTimeout(() => {
                    appendLine("<span class='defcon-warning'>WINNER: NONE</span>");
                    appendLine("<br>A STRANGE GAME.");
                    appendLine("THE ONLY WINNING MOVE IS NOT TO PLAY.");
                    appendLine("<br>HOW ABOUT A NICE GAME OF CHESS OR TIC-TAC-TOE?");
                    state = 'SELECT_GAME';
                }, 2000);
            }
        }, 800);
    }

    function endGame() {
        state = 'INITIAL';
        appendLine("<br>SHALL WE PLAY ANOTHER GAME? (TYPE 'LIST' FOR MENU)");
    }

    sendBtn.addEventListener('click', processInput);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processInput();
    });
</script>

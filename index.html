<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.O.P.R. Mainframe Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <!-- CRT Monitor Effect Overlays -->
        <div class="scanlines"></div>
        <div class="crt-glow"></div>

        <!-- Main Output Screen -->
        <div id="screen">
            <div class="line system-msg">LOGON: WOPR / NORAD-CHEYENNE-MT</div>
            <div class="line system-msg">SHALL WE PLAY A GAME?</div>
        </div>

        <!-- Input Bar Section -->
        <div class="input-container">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" autocomplete="off" autofocus placeholder="Type here...">
            <button id="sendBtn">EXECUTE</button>
        </div>
    </div>

    <!-- Optional Test UI Container from original script -->
    <div class="card" style="margin-top: 20px; display: none;">
        <p id="status-text">Disconnected</p>
        <button id="action-btn">Connect</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>W.O.P.R. Mainframe Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <!-- Main Cinematic Display Feed Box -->
        <div id="screen" class="terminal-screen"></div>
        
        <!-- Bottom Interaction Prompt Input Entry Loop -->
        <div class="input-line">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

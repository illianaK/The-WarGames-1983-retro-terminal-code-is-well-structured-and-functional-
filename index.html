<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.O.P.R. Mainframe Terminal</title>
    <!-- Link to the external retro Cyan stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="terminal-container">
    <div class="crt-screen">
        <!-- Main dynamic typewriter output canvas -->
        <div id="screen"></div>

        <!-- Command processing line entry block -->
        <div class="input-area">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<!-- Links to your repaired unbeatable game engines -->
<script src="script.js"></script>
</body>
</html>

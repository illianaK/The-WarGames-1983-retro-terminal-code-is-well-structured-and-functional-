<!DOCTYPE html>
<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.O.P.R. Mainframe Terminal</title>
    <style>
        :root {
            --glow-color: #00ff66;
            --bg-color: #051a05;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: var(--glow-color);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* CRT Screen Simulation Container */
        .terminal-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 650px;
            background-color: var(--bg-color);
            border: 4px solid #113f11;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Phosphor Scanline Overlay */
        .terminal-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
        /* CRT Screen Flicker and Glow Effect */
        .crt-screen {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: textShadow 0.8s infinite alternate;
        }
        #screen {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        /* Hide default scrollbars while retaining scroll mechanics */
        #screen::-webkit-scrollbar {
            width: 6px;
        }
        #screen::-webkit-scrollbar-thumb {
            background: #113f11;
            border-radius: 3px;
        }
        .line {
            line-height: 1.4;
            white-space: pre-wrap;
            margin-bottom: 6px;
            text-shadow: 0 0 4px var(--glow-color);
        }
        .user-msg {
            color: #ffffff;
            text-shadow: 0 0 4px #ffffff;
        }
        .system-msg {
            color: var(--glow-color);
        }
        .warn-msg {
            color: #ff3333;
            text-shadow: 0 0 6px #ff3333;
        }
        .input-area {
            display: flex;
            align-items: center;
            border-top: 2px solid #113f11;
            padding-top: 15px;
            background-color: rgba(5, 26, 5, 0.8);
        }
        .prompt {
            font-size: 1.1rem;
            margin-right: 10px;
            text-shadow: 0 0 4px var(--glow-color);
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--glow-color);
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            text-shadow: 0 0 4px var(--glow-color);
        }
        /* Tic Tac Toe Dynamic Grid Classes */
        .ttt-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 8px;
            margin: 15px 0;
        }
        .ttt-cell {
            width: 60px;
            height: 60px;
            border: 2px solid var(--glow-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            background: rgba(0, 255, 102, 0.05);
            transition: background 0.2s;
        }
        .ttt-cell:hover {
            background: rgba(0, 255, 102, 0.2);
        }
        /* Secret Easter Egg Canvas Element */
        #galagaCanvas {
            border: 2px solid var(--glow-color);
            background: #000;
            display: block;
            margin: 10px auto;
            box-shadow: 0 0 15px rgba(0,255,102,0.2);
        }
        @keyframes textShadow {
            0% { text-shadow: 0 0 4px rgba(0,255,102,0.5); }
            100% { text-shadow: 0 0 6px rgba(0,255,102,0.9); }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="crt-screen">
        <div id="screen"></div>
        <div class="input-area">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<script>
const screen = document.getElementById('screen');
const input = document.getElementById('userInput');

// Terminal State Tracker Machine
let state = 'INITIAL';
let simInterval = null;
let galagaLoop = null;

// Game Global Memory Buffers
let gameData = {};
let tttBoard = ['', '', '', '', '', '', '', '', ''];
let playerTurn = true;
let activeBoardElement = null;

const games = [
    "FALKEN'S MAZE",
    "BLACK JACK",
    "GIN RUMMY",
    "HEARTS",
    "BRIDGE",
    "CHECKERS",
    "CHESS",
    "POKER",
    "TIC-TAC-TOE",
    "GLOBAL THERMONUCLEAR WAR"
];

// --- NATIVE BROWSER AUDIO MAIN SYNTH SYSTEM ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

const sounds = {
    click: () => playTone(650, 'square', 0.02),
    print: () => playTone(850, 'sine', 0.015),
    pew: () => playTone(880, 'sawtooth', 0.07),
    enemyPew: () => playTone(440, 'sine', 0.06),
    boom: () => playTone(140, 'sawtooth', 0.25),
    hurt: () => {
        playTone(200, 'triangle', 0.15);
        setTimeout(() => playTone(150, 'triangle', 0.15), 100);
    },
    warn: () => {
        playTone(480, 'sawtooth', 0.08);
        setTimeout(() => playTone(360, 'sawtooth', 0.08), 90);
    }
};

// --- CORE RETRO ASYNC TYPEWRITER PRINTER ---
function appendLine(text, className = 'system-msg') {
    return new Promise((resolve) => {
        const line = document.createElement('div');
        line.className = `line ${className}`;
        screen.appendChild(line);

        if ((text.includes('<') && text.includes('>')) || className === 'user-msg') {
            line.innerHTML = text;
            screen.scrollTop = screen.scrollHeight;
            if (className !== 'user-msg') sounds.print();
            resolve();
        } else {
            let index = 0;
            function typeChar() {
                if (index < text.length) {
                    line.textContent += text.charAt(index);
                    index++;
                    sounds.print();
                    screen.scrollTop = screen.scrollHeight;
                    setTimeout(typeChar, 10);
                } else {
                    resolve();
                }
            }
            typeChar();
        }
    });
}

// --- TERMINAL COMMAND INPUT PROCESSOR ---
function processInput() {
    const text = input.value.trim();
    if (!text && state !== 'GAME_TTT') return;

    if (text) {
        sounds.click();
        appendLine(`> ${text}`, 'user-msg');
        input.value = '';
    }

    const upperText = text.toUpperCase();

    // Global escape commands
    if (upperText === 'QUIT' || upperText === 'EXIT' || upperText === 'BYE') {
        cleanUpActiveLoops();
        resetTerminal();
        return;
    }

    // Secret Easter Egg Trigger
    if (upperText === 'GALAGA') {
        cleanUpActiveLoops();
        startGalagaSecretEgg();
        return;
    }

    switch (state) {
        case 'INITIAL':
            if (upperText.includes('GAME') || upperText.includes('YES') || upperText.includes('LIST')) {
                appendLine("AVAILABLE GAMES:").then(() => {
                    games.forEach((g, i) => appendLine(`  ${i + 1}. ${g}`));
                    appendLine("<br>PLEASE CHOOSE A GAME NAME OR NUMBER:");
                    state = 'SELECT_GAME';
                });
            } else {
                appendLine("I'M SORRY, PROFESSOR. WOULD YOU LIKE TO SEE THE LIST OF GAMES?");
            }
            break;

        case 'SELECT_GAME':
            handleGameSelection(upperText);
            break;

        case 'GAME_MAZE': handleMazeInput(upperText); break;
        case 'GAME_BJ': handleBlackjackInput(upperText); break;
        case 'GAME_RUMMY': case 'GAME_HEARTS': case 'GAME_BRIDGE': case 'GAME_POKER':
            handleCardSimInput(upperText); break;
        case 'GAME_CHECKERS': case 'GAME_CHESS': handleBoardSimInput(upperText); break;
        case 'GAME_WAR':
            if (upperText === 'STOP') {
                clearInterval(simInterval);
                appendLine("WAR SIMULATION EMERGENCY CANCELLATION DETECTED.");
                resetTerminal();
            }
            break;
    }
}

function cleanUpActiveLoops() {
    if (simInterval) clearInterval(simInterval);
    if (galagaLoop) cancelAnimationFrame(galagaLoop);
    window.onkeydown = null;
    window.onkeyup = null;
}

// --- SELECTING ROUTER PIPELINE ---
 lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.O.P.R. Mainframe Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <!-- CRT Monitor Effects -->
        <div class="scanlines"></div>
        <div class="crt-glow"></div>

        <!-- Pure Text Output Console Screen -->
        <div id="screen">
            <div class="line system-msg">LOGON: WOPR / NORAD-CHEYENNE-MT</div>
            <div class="line system-msg">SHALL WE PLAY A GAME?</div>
        </div>

        <!-- The Pure Command-Line Terminal Prompt -->
        <div class="input-container">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" autocomplete="off" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
